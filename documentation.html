<!DOCTYPE html>
<html lang="fr">
  <!DOCTYPE html>
  <html lang="fr">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>En cours de rédaction</title>
      <style>
          body {
              font-family: Arial, sans-serif;
              background-color: #f4f4f9;
              color: #333;
              text-align: center;
              padding: 50px;
          }
          h1 {
              color: #0056b3;
              font-size: 2.5em;
          }
          p {
              font-size: 1.2em;
              color: #666;
          }
          .spinner {
              margin: 30px auto;
              width: 50px;
              height: 50px;
              border: 6px solid #f4f4f9;
              border-top: 6px solid #0056b3;
              border-radius: 50%;
              animation: spin 1s linear infinite;
          }
          @keyframes spin {
              0% { transform: rotate(0deg); }
              100% { transform: rotate(360deg); }
          }
          a {
              display: inline-block;
              margin-top: 30px;
              padding: 10px 20px;
              background-color: #0056b3;
              color: #fff;
              text-decoration: none;
              border-radius: 5px;
          }
          a:hover {
              background-color: #003d80;
          }
      </style>
  </head>
  <body>
      <h1>Page en cours de rédaction</h1>
      <div class="spinner"></div>
      <p>Cette page est actuellement en cours de rédaction. Revenez bientôt pour découvrir le contenu !</p>
      <a href="index.html">Retour à l'accueil</a>
  </body>
  </html>
